# Hält das kostenlose Supabase-Projekt aktiv (pausiert sonst nach ~7 Tagen ohne Nutzung)
# und sorgt dafür, dass GitHub diesen geplanten Workflow nicht nach 60 Tagen Ruhe abschaltet.
name: Keep-Alive

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        env:
          SB_URL: https://nwrcohvrxxsccyllgfzl.supabase.co
          # öffentlicher Anon-Key (steht auch in index.html), Daten sind per Row Level Security geschützt
          SB_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53cmNvaHZyeHhzY2N5bGxnZnpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxMzU2NzYsImV4cCI6MjEwNzcxMTY3Nn0.9uL7MnSKKFQ_9sm2FNGbXiuyXTf3V8wRITkBv07llHA
        run: |
          curl -fsS --retry 3 --retry-delay 20 -X POST "$SB_URL/rest/v1/rpc/ping" \
            -H "apikey: $SB_KEY" -H "Authorization: Bearer $SB_KEY" -H "Content-Type: application/json" -d '{}'
          echo

      - uses: actions/checkout@v4
      - name: Repo alle 50 Tage kurz anstoßen
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50*86400 )) ]; then
            date -u +%FT%TZ > .github/keepalive
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "Keep-Alive" && git push
          fi
