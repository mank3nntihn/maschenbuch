name: Automatische Tests

# Browser-Tests der Website bei jedem Push. Die Datenbank-Tests laufen separat (datenbank.yml),
# nur wenn sich unter supabase/ etwas ändert – sie brauchen über eine Minute für den Supabase-Start.
on:
  push:
    branches: [main]
    paths-ignore: ['.github/keepalive', 'garne.json', '**.md', 'tools/**', 'supabase/**', '.github/workflows/datenbank.yml', '.github/workflows/keepalive.yml', '.github/workflows/garne.yml']
  pull_request:
  workflow_dispatch:

jobs:
  website:
    name: Website (Browser-Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright installieren (nutzt das vorinstallierte Google Chrome)
        run: npm install --no-save --no-package-lock playwright@1.49.1
      - name: Website lokal starten
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
      - name: Tests ausführen (Gruppen parallel)
        env:
          PW_CHANNEL: chrome
        run: node tests/run.js
      - name: Bildschirmfotos bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screens
          path: test-screens/
          if-no-files-found: ignore
