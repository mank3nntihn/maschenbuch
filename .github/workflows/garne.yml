# Holt täglich den Hobbii-Katalog (Preise, Angebote, Lieferbarkeit) und berechnet für neue Farben die exakte Farbe aus dem Foto.
name: Garnliste aktualisieren

on:
  schedule:
    - cron: "43 3 * * *"   # täglich 03:43 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  garne:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/garne_aktualisieren.py garne.json
      - name: Änderungen speichern
        run: |
          if git diff --quiet garne.json; then echo "Keine Änderungen"; exit 0; fi
          git config user.name "garnliste-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          n=$(python3 -c "import json;print(json.load(open('garne.json')).get('angebote',0))")
          git add garne.json && git commit -m "Garnliste aktualisiert ($n Angebote)" && git push
