<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Maschenbuch Demo</title>
<style>
:root{--ink:#3a3150;--mu:#6e6486;--ac:#f6a9c9}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
body{background:linear-gradient(135deg,#d6ebfb 0%,#e9e4fa 48%,#fde0ec 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.b1{width:620px;height:620px;background:#fbcfe3;left:-160px;top:-180px}.b2{width:520px;height:520px;background:#cfe6fb;right:200px;bottom:-200px}
.brand{position:absolute;left:140px;top:96px;display:flex;align-items:center;gap:14px;font:600 30px Georgia,serif;letter-spacing:.2px}
.brand i{font-style:normal;font-size:38px}
.panel{position:absolute;left:140px;top:290px;width:900px}
.kicker{font:600 22px Inter,sans-serif;color:#c25b8a;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 18px}
h1{font:700 64px/1.08 Georgia,serif;margin:0 0 26px;letter-spacing:-.5px}
.sub{font:400 30px/1.45 Inter,sans-serif;color:var(--mu);margin:0;max-width:820px}
.fade{transition:opacity .45s ease,transform .45s ease}.out{opacity:0;transform:translateY(14px)}
.dots{position:absolute;left:140px;bottom:110px;display:flex;gap:10px}
.dots i{width:12px;height:12px;border-radius:6px;background:rgba(58,49,80,.18);transition:all .3s}.dots i.on{width:36px;background:var(--ac)}
.phone{position:absolute;right:190px;top:50%;transform:translateY(-50%);width:458px;height:960px;border-radius:64px;background:#1c1824;padding:14px;box-shadow:0 40px 90px rgba(60,40,90,.35),inset 0 0 0 2px #3a3446}
.screen{position:relative;width:430px;height:932px;border-radius:52px;overflow:hidden;background:#fff}
.screen iframe{width:430px;height:932px;border:0;display:block}
.island{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:126px;height:36px;border-radius:20px;background:#0d0b12;z-index:3}
.tap{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(246,169,201,.55);border:3px solid rgba(255,255,255,.9);pointer-events:none;z-index:10;animation:tap .7s ease-out forwards}
@keyframes tap{0%{transform:scale(.4);opacity:1}70%{opacity:.9}100%{transform:scale(1.5);opacity:0}}
.card{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#d6ebfb 0%,#e9e4fa 48%,#fde0ec 100%);transition:opacity .7s ease}
.card.hide{opacity:0;pointer-events:none}
.card .big{font-size:110px;line-height:1}.card h2{font:700 92px Georgia,serif;margin:22px 0 18px}.card p{font:400 34px/1.5 Inter,sans-serif;color:var(--mu);margin:0;max-width:1300px}
.card ul{list-style:none;padding:0;margin:34px 0 0;font:500 32px/1.75 Inter,sans-serif;text-align:left}
.card .who{margin-top:46px;font:600 28px Inter,sans-serif;color:var(--ink)}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="brand"><i>🧶</i>Maschenbuch</div>
<div class="panel"><p class="kicker fade" id="k"></p><h1 class="fade" id="t"></h1><p class="sub fade" id="s"></p></div>
<div class="dots" id="dots"></div>
<div class="phone"><div class="screen"><div class="island"></div><iframe id="app" src="../../index.html"></iframe></div></div>
<div class="card" id="card"></div>
<script>
// Szenentext links (sanft überblenden)
function cap(k,t,s,n,total){const els=['k','t','s'].map(i=>document.getElementById(i));els.forEach(e=>e.classList.add('out'));
  setTimeout(()=>{document.getElementById('k').textContent=k;document.getElementById('t').innerHTML=t;document.getElementById('s').innerHTML=s;els.forEach(e=>e.classList.remove('out'))},450);
  const d=document.getElementById('dots');if(total&&d.children.length!==total)d.innerHTML='<i></i>'.repeat(total);[...d.children].forEach((x,i)=>x.classList.toggle('on',i===n))}
// Tipp-Markierung an einer Bildschirmposition
function tap(x,y){const e=document.createElement('div');e.className='tap';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),800)}
addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0)});
function card(html){const c=document.getElementById('card');if(html===null){c.classList.add('hide');return}c.innerHTML=html;c.classList.remove('hide')}
</script></body></html>
